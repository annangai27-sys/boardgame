<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CARCASSONNE Leaderboard</title>
  <meta name="theme-color" content="#7a4f2b" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Medieval Score Chronicle</p>
        <h1>CARCASSONNE Leaderboard</h1>
        <p class="subline">Record each game score. Rankings are calculated automatically by peak score, average score, and wins.</p>
      </div>
      <div class="crest" aria-hidden="true">🏰</div>
    </header>

    <main class="layout">
      <section class="panel scroll-panel">
        <div class="section-title">
          <span>🧩</span>
          <h2>Add Game Result</h2>
        </div>
        <label class="field-label">Date</label>
        <input id="gameDate" type="date" />
        <label class="field-label">Game / Expansion</label>
        <input id="gameName" type="text" placeholder="Carcassonne / Inns & Cathedrals" />
        <div class="players-head">
          <label class="field-label">Players & Scores</label>
          <button id="addPlayer" class="secondary">+ Add player</button>
        </div>
        <div id="playerRows" class="player-rows"></div>
        <button id="saveGame" class="primary">Save this conquest</button>
        <p class="hint">Highest score in that game becomes 1st place automatically. Ties count as shared wins.</p>
      </section>

      <section class="panel leaderboard-panel">
        <div class="section-title">
          <span>🏆</span>
          <h2>Leaderboard</h2>
        </div>
        <div class="tabs" role="tablist">
          <button class="tab active" data-mode="peak">Peak Score</button>
          <button class="tab" data-mode="average">Average Score</button>
          <button class="tab" data-mode="wins">Wins</button>
        </div>
        <div id="leaderboard" class="leaderboard"></div>
      </section>
    </main>

    <section class="panel history-panel">
      <div class="section-title">
        <span>📜</span>
        <h2>Game History</h2>
      </div>
      <div class="history-actions">
        <button id="clearAll" class="danger">Clear all records</button>
      </div>
      <div id="history" class="history"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
