<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Board Game Leaderboard</title>
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Board Rank" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <style>
    :root{
      --bg:#0f1115;--card:#171a21;--card2:#20242d;--text:#f2f4f8;--muted:#a7afbd;--line:#303644;--accent:#d6ff4f;--bad:#ff6b6b;
    }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:linear-gradient(180deg,#11151d,#08090c);color:var(--text);}
    header{padding:32px 20px 16px;max-width:1100px;margin:auto} h1{margin:0;font-size:34px;letter-spacing:-.04em} p{color:var(--muted);line-height:1.6}.app{max-width:1100px;margin:auto;padding:0 20px 50px;display:grid;gap:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:rgba(23,26,33,.92);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.25)}h2{font-size:18px;margin:0 0 14px}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}input,select,button,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#0f1218;color:var(--text);padding:11px 12px;font-size:14px}button{cursor:pointer;background:var(--accent);color:#111;font-weight:800;border:0;margin-top:12px}button.secondary{background:#2a303c;color:var(--text)}button.danger{background:var(--bad);color:#111}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player-row{display:grid;grid-template-columns:1.4fr .8fr .8fr 38px;gap:8px;align-items:end;margin-bottom:8px}.xbtn{padding:10px 0;background:#30242a;color:#ffb2b2}.table-wrap{overflow:auto;border-radius:14px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:#11151d}tr:last-child td{border-bottom:0}.rank{font-weight:900;color:var(--accent)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#2a303c;color:var(--muted);font-size:12px}.empty{padding:28px;text-align:center;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{width:auto;padding:11px 14px}.small{font-size:12px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.player-row{grid-template-columns:1fr 70px 80px 38px}h1{font-size:28px}}
  </style>
</head>
<body>
  <header>
    <h1>Board Game Leaderboard</h1>
    <p>輸入每場遊戲結果，自動根據人數同名次計分。資料會儲存在你呢個 browser 入面。</p>
  </header>

  <main class="app">
    <section class="grid">
      <div class="card">
        <h2>新增一場遊戲</h2>
        <div class="row">
          <div><label>日期</label><input id="date" type="date" /></div>
          <div><label>Board Game</label><input id="game" placeholder="例如 Catan / Azul / Wingspan" /></div>
        </div>
        <label>玩家、名次、原遊戲分數（原分數可不填）</label>
        <div id="players"></div>
        <button class="secondary" onclick="addPlayerRow()">+ 加玩家</button>
        <button onclick="saveGame()">儲存呢場結果</button>
        <p class="small">計分：Leaderboard Points = 人數 - 名次 + 1。例：4人局第1名=4分，第4名=1分。</p>
      </div>

      <div class="card">
        <h2>設定 / Export</h2>
        <label>最低入榜局數</label>
        <input id="minGames" type="number" min="1" value="1" onchange="render()" />
        <div class="actions">
          <button class="secondary" onclick="exportJSON()">Export JSON</button>
          <button class="secondary" onclick="exportCSV()">Export CSV</button>
          <button class="secondary" onclick="importJSONPrompt()">Import JSON</button>
          <button class="danger" onclick="clearAll()">清空全部</button>
        </div>
        <label>Import JSON</label>
        <textarea id="importBox" rows="6" placeholder="貼上之前 export 出嚟嘅 JSON"></textarea>
      </div>
    </section>

    <section class="card">
      <h2>排行榜</h2>
      <div id="leaderboard"></div>
    </section>

    <section class="card">
      <h2>比賽紀錄</h2>
      <div id="history"></div>
    </section>
  </main>

<script>
const STORAGE_KEY = 'boardgameLeaderboard.v1';
let games = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

document.getElementById('date').valueAsDate = new Date();

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(games)); }
function addPlayerRow(name='', rank='', raw=''){
  const div = document.createElement('div');
  div.className = 'player-row';
  div.innerHTML = `
    <div><input class="pname" placeholder="玩家名" value="${escapeAttr(name)}"></div>
    <div><input class="prank" type="number" min="1" placeholder="名次" value="${rank}"></div>
    <div><input class="pscore" type="number" placeholder="原分" value="${raw}"></div>
    <button class="xbtn" onclick="this.parentElement.remove()">×</button>`;
  document.getElementById('players').appendChild(div);
}
function escapeAttr(str){ return String(str).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;'); }
function initRows(){ ['','','',''].forEach(()=>addPlayerRow()); }

function saveGame(){
  const date = document.getElementById('date').value;
  const gameName = document.getElementById('game').value.trim();
  const rows = [...document.querySelectorAll('.player-row')].map(r => ({
    name: r.querySelector('.pname').value.trim(),
    rank: Number(r.querySelector('.prank').value),
    rawScore: r.querySelector('.pscore').value === '' ? null : Number(r.querySelector('.pscore').value)
  })).filter(p => p.name && p.rank);

  if(!date || !gameName || rows.length < 2){ alert('請輸入日期、遊戲名，至少兩位玩家同名次。'); return; }
  const ranks = rows.map(p=>p.rank);
  if(new Set(ranks).size !== ranks.length){ alert('暫時未支援同名次，請用不同名次。'); return; }
  if(Math.min(...ranks) !== 1 || Math.max(...ranks) > rows.length){ alert('名次需要由 1 開始，而且不能大過人數。'); return; }

  const playerCount = rows.length;
  rows.forEach(p => p.points = playerCount - p.rank + 1);
  games.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), date, gameName, playerCount, players: rows });
  save();
  document.getElementById('game').value = '';
  document.getElementById('players').innerHTML = '';
  initRows();
  render();
}

function getLeaderboard(){
  const map = {};
  games.forEach(g => g.players.forEach(p => {
    if(!map[p.name]) map[p.name] = {name:p.name, games:0, wins:0, totalPoints:0, totalRank:0, rawTotal:0};
    const s = map[p.name];
    s.games++; s.wins += p.rank === 1 ? 1 : 0; s.totalPoints += p.points; s.totalRank += p.rank; s.rawTotal += Number(p.rawScore || 0);
  }));
  const minGames = Number(document.getElementById('minGames').value || 1);
  return Object.values(map).filter(s=>s.games>=minGames).map(s => ({
    ...s,
    avgPoints: s.totalPoints / s.games,
    winRate: s.wins / s.games,
    avgRank: s.totalRank / s.games
  })).sort((a,b)=> b.avgPoints-a.avgPoints || b.winRate-a.winRate || a.avgRank-b.avgRank || b.games-a.games);
}

function render(){
  const lb = getLeaderboard();
  document.getElementById('leaderboard').innerHTML = lb.length ? `
    <div class="table-wrap"><table><thead><tr><th>Rank</th><th>玩家</th><th>平均積分</th><th>總積分</th><th>局數</th><th>勝出</th><th>勝率</th><th>平均名次</th></tr></thead><tbody>
    ${lb.map((s,i)=>`<tr><td class="rank">#${i+1}</td><td>${s.name}</td><td>${s.avgPoints.toFixed(2)}</td><td>${s.totalPoints}</td><td>${s.games}</td><td>${s.wins}</td><td>${Math.round(s.winRate*100)}%</td><td>${s.avgRank.toFixed(2)}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">未有足夠紀錄</div>';

  const history = [...games].reverse();
  document.getElementById('history').innerHTML = history.length ? `
    <div class="table-wrap"><table><thead><tr><th>日期</th><th>遊戲</th><th>人數</th><th>結果</th><th></th></tr></thead><tbody>
    ${history.map(g=>`<tr><td>${g.date}</td><td>${g.gameName}</td><td>${g.playerCount}</td><td>${g.players.sort((a,b)=>a.rank-b.rank).map(p=>`<span class="pill">${p.rank}. ${p.name} · ${p.points}pt</span>`).join(' ')}</td><td><button class="danger" onclick="deleteGame('${g.id}')">刪除</button></td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">未有比賽紀錄</div>';
}
function deleteGame(id){ games = games.filter(g=>g.id!==id); save(); render(); }
function clearAll(){ if(confirm('確定清空全部紀錄？')){ games=[]; save(); render(); } }
function exportJSON(){ download('boardgame-leaderboard.json', JSON.stringify(games,null,2), 'application/json'); }
function exportCSV(){
  const rows = [['date','game','player_count','player','rank','raw_score','leaderboard_points']];
  games.forEach(g=>g.players.forEach(p=>rows.push([g.date,g.gameName,g.playerCount,p.name,p.rank,p.rawScore ?? '',p.points])));
  const csv = rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');
  download('boardgame-leaderboard.csv', csv, 'text/csv');
}
function download(filename, text, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=filename; a.click(); URL.revokeObjectURL(a.href); }
function importJSONPrompt(){
  try{ const data = JSON.parse(document.getElementById('importBox').value); if(!Array.isArray(data)) throw new Error(); games=data; save(); render(); alert('Import 完成'); }
  catch(e){ alert('JSON 格式唔啱'); }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}

initRows(); render();
</script>
</body>
</html>
